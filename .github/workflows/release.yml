name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify annotated signed release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo 'release tag must be semantic version syntax such as v0.1.0' >&2
            exit 1
          fi
          ref_path="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          if [[ "$(gh api "$ref_path" --jq '.object.type')" != 'tag' ]]; then
            echo 'release tag must be an annotated signed tag' >&2
            exit 1
          fi
          tag_object="$(gh api "$ref_path" --jq '.object.sha')"
          tag_path="repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}"
          if [[ "$(gh api "$tag_path" --jq '.verification.verified')" != 'true' ]]; then
            echo 'GitHub did not verify the release tag signature' >&2
            exit 1
          fi
          if [[ "$(gh api "$tag_path" --jq '.object.type')" != 'commit' ]] || \
             [[ "$(gh api "$tag_path" --jq '.object.sha')" != "$GITHUB_SHA" ]]; then
            echo 'release tag does not point directly at the workflow commit' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/djangoailab/blog-studio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Create and verify release artifacts
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bash scripts/create-release-artifacts.sh \
            --tag "$RELEASE_TAG" \
            --ref "$GITHUB_SHA" \
            --image ghcr.io/djangoailab/blog-studio \
            --digest "$IMAGE_DIGEST" \
            --output release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/blog-studio-${{ github.ref_name }}.tar.gz \
            release/container-digest.txt \
            release/release-metadata.json \
            release/SHA256SUMS \
            release/RELEASE_NOTES.md \
            release/UPGRADE.md \
            --verify-tag \
            --notes-file release/RELEASE_NOTES.md \
            --title "Blog Studio ${{ github.ref_name }}"
