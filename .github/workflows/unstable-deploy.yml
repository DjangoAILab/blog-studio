name: Unstable deploy

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: unstable-home-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: home-server
    runs-on: [self-hosted, home-server]
    timeout-minutes: 30
    environment:
      name: unstable
      url: https://blog-editor.internal.wj2015.com
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and recreate the unstable editor
        env:
          BLOG_STUDIO_SERVICE_DIR: /home/wang/services/blog-studio
          BLOG_STUDIO_VCS_REF: ${{ github.sha }}
        run: bash scripts/deploy-unstable.sh
