name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.21.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run quality gates
        run: pnpm check

      - name: Run browser authoring journey
        run: pnpm --filter @blog-studio/studio e2e

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository, secrets, licenses, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: CRITICAL
          exit-code: '1'
          timeout: 10m

      - name: Build production image
        run: docker build --build-arg VCS_REF=${{ github.sha }} --tag blog-studio:ci .

      - name: Run documented Quick Start journey
        env:
          BLOG_STUDIO_QUICK_START_IMAGE: blog-studio:ci
          BLOG_STUDIO_QUICK_START_SKIP_BUILD: 'true'
        run: bash scripts/quick-start-smoke.sh

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: blog-studio:ci
          scanners: vuln,secret,misconfig,license
          severity: CRITICAL
          exit-code: '1'
          timeout: 10m
